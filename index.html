<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout MyL - Marco Cerrado Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Orbitron:wght@700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --fire-main: #ff4d00;
            --dark-tcg: #0a0a0c;
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background: transparent !important;
            font-family: 'Bangers', cursive;
            overflow: hidden;
        }

        /* ESTRUCTURA DE MARCO CERRADO: Izquierda (40px) | Centro | Derecha (420px) */
        .layout-grid {
            display: grid;
            grid-template-columns: 40px 1fr 420px;
            grid-template-rows: 160px 1fr 45px; 
            width: 100%; height: 100%;
        }

        /* --- HEADER (SUPERIOR) --- */
        .header {
            grid-column: 1 / span 3;
            background: black;
            border-bottom: 4px solid var(--neon-cyan);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 60px; z-index: 10; position: relative;
        }

        .title-group { position: absolute; left: 50%; transform: translateX(-50%); text-align: center; z-index: 20; }
        .team-title { font-size: 5.5rem; text-shadow: 0 0 20px var(--neon-cyan); margin: 0; line-height: 1; color: white; }
        .subtitle-myl { margin: 0; font-family: 'Orbitron'; color: var(--neon-green); letter-spacing: 5px; }

        /* TAO PAI PAI ANIMADO */
        .tao-container { position: relative; width: 280px; height: 150px; display: flex; align-items: center; justify-content: center; z-index: 15; }
        .tao-img { height: 130px; z-index: 2; filter: drop-shadow(0 0 10px var(--neon-pink)); animation: flyFloat 3s ease-in-out infinite; }
        .speed-lines { position: absolute; right: 40%; width: 200px; height: 100px; z-index: 1; overflow: hidden; }
        .line { position: absolute; background: linear-gradient(90deg, transparent, var(--neon-green)); height: 2px; border-radius: 2px; opacity: 0.6; animation: moveLines 0.5s linear infinite; }
        @keyframes moveLines { from { transform: translateX(0); } to { transform: translateX(-200px); opacity: 0; } }
        @keyframes flyFloat { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(1deg); } }

        /* PERSONAJES HEADER */
        .char-container { position: absolute; top: 0; height: 156px; width: 400px; overflow: hidden; display: flex; justify-content: center; z-index: 1; }
        .char-left { left: 18%; } .char-right { right: 18%; }
        .bg-character { height: 200%; transform: translateY(-20px); animation: burn 1.5s infinite alternate; }
        @keyframes burn { 0% { filter: brightness(0.7); } 100% { filter: brightness(1.2) drop-shadow(0 0 20px var(--fire-main)); } }

        /* LOGO AO GEEK */
        .logo-geek { width: 200px; filter: drop-shadow(0 0 15px var(--neon-cyan)); animation: geekPulse 4s infinite ease-in-out; z-index: 15; }
        @keyframes geekPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05) rotate(1deg); } }

        /* --- BARRA LATERAL IZQUIERDA (NUEVA PARA CERRAR EL MARCO) --- */
        .left-bar {
            background-color: var(--dark-tcg);
            border-right: 3px solid var(--neon-cyan);
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- SIDEBAR (DERECHA) --- */
        .sidebar {
            background-color: var(--dark-tcg);
            border-left: 3px solid var(--neon-cyan);
            padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow: hidden;
            background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .neon-border { border: 1px solid var(--neon-cyan); padding: 12px; border-radius: 10px; background: rgba(0, 0, 0, 0.9); }

        /* --- NUEVO CUADRO DE CHAT --- */
        .chat-container-box {
            width: 100%;
            flex-grow: 1; /* Ocupa todo el espacio disponible */
            display: flex;
            flex-direction: column;
            border: 1px solid var(--neon-cyan);
            box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        /* Efecto de fondo para el chat */
        .chat-container-box::before {
            content: "STREAM CHAT";
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-family: 'Orbitron'; font-size: 2rem; color: rgba(255,255,255,0.03);
            white-space: nowrap; pointer-events: none;
        }

        /* --- SOCIAL --- */
        .social-box { border: 2px solid var(--neon-pink); background: black; padding: 10px; text-align: center; border-radius: 10px; }
        .instagram-tag { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Montserrat'; font-size: 1.2rem; color: var(--neon-cyan); }

        /* --- FOOTER (INFERIOR) --- */
        .footer-bar {
            grid-column: 1 / span 3;
            background: #000;
            border-top: 4px solid var(--neon-cyan);
            display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        .footer-text { color: white; font-family: 'Orbitron'; font-size: 0.7rem; letter-spacing: 15px; opacity: 0.5; }
        
        .label { display: block; color: var(--neon-pink); font-size: 1rem; text-transform: uppercase; margin-bottom: 10px; font-family: 'Orbitron'; text-align: center; }
    </style>
</head>
<body>

    <div class="layout-grid">
        <!-- CABECERA -->
        <header class="header">
            <div class="tao-container">
                <div class="speed-lines">
                    <div class="line" style="top:20%; width:80px; animation-delay: 0.1s"></div>
                    <div class="line" style="top:50%; width:120px; animation-delay: 0.3s"></div>
                    <div class="line" style="top:80%; width:60px; animation-delay: 0s"></div>
                </div>
                <img src="tao_logo.png" class="tao-img">
            </div>
            <div class="char-container char-left"><img src="personaje_bg.png" class="bg-character"></div>
            <div class="title-group">
                <p class="subtitle-myl">MITOS Y LEYENDAS</p>
                <h1 class="team-title">TEAM TAO PAI PAI</h1>
            </div>
            <div class="char-container char-right"><img src="personaje_right.png" class="bg-character"></div>
            <img src="aogeek.png" class="logo-geek">
        </header>

        <!-- MARCO IZQUIERDO -->
        <div class="left-bar"></div>

        <!-- AREA CENTRAL (TU VIDEO) -->
        <main style="background: transparent;"></main>

        <!-- LATERAL DERECHO (CHAT) -->
        <aside class="sidebar">
            <span class="label">Comunidad Chat</span>
            <div class="neon-border chat-container-box">
                <!-- El chat de OBS se coloca encima de esta área -->
            </div>

            <div class="social-box">
                <div class="instagram-tag"><i class="fab fa-instagram"></i> @teamtaopaipai</div>
            </div>
        </aside>

        <!-- BARRA INFERIOR -->
        <footer class="footer-bar">
            <div class="footer-text">TEAM TAO PAI PAI • OFFICIAL LAYOUT</div>
        </footer>
    </div>

</body>
</html>
